name: Build and Push Docker Images

on:
  push:
    branches: [ main, master ]
    paths:
      - 'doh-server/**'
      - 'doh-proxy/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'doh-server/**'
      - 'doh-proxy/**'
      - '.github/workflows/docker-build.yml'

env:
  REGISTRY: docker.io

jobs:
  build-doh-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata for doh-server
      id: meta-doh-server
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/doh-server
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push doh-server Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./doh-server
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta-doh-server.outputs.tags }}
        labels: ${{ steps.meta-doh-server.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-doh-proxy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata for doh-proxy
      id: meta-doh-proxy
      uses: docker/metadata-action@v6
      with:
        images: krisfremen/doh-proxy
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push doh-proxy Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./doh-proxy
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta-doh-proxy.outputs.tags }}
        labels: ${{ steps.meta-doh-proxy.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
