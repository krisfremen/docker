name: Build and Push OpenLDAP Docker Image

on:
  push:
    branches: [ main, master ]
    paths:
      - 'openldap/**'
      - '.github/workflows/docker-openldap.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'openldap/**'
      - '.github/workflows/docker-openldap.yml'

env:
  REGISTRY: docker.io

jobs:
  build-openldap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: Get submodule version
      id: submodule-version
      run: ./openldap/get-version.sh

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata for openldap
      id: meta-openldap
      uses: docker/metadata-action@v6
      with:
        images: krisfremen/openldap
        tags: |
          type=raw,value=${{ steps.submodule-version.outputs.tag }},enable=${{ steps.submodule-version.outputs.tag != '' }}
          type=raw,value=${{ steps.submodule-version.outputs.version }},enable=${{ steps.submodule-version.outputs.version != '' }}
          type=raw,value=${{ steps.submodule-version.outputs.commit }}
          type=ref,event=branch,enable=${{ github.event_name != 'pull_request' }},pattern={{sanitize:branch}}
          type=ref,event=pr
          type=sha,prefix=sha-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push openldap Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./openldap
        file: ./openldap/Dockerfile.debian
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta-openldap.outputs.tags }}
        labels: ${{ steps.meta-openldap.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
